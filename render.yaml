services:
  - type: web
    name: eco-tech-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.ts
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
